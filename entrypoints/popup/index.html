<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- WXT uses this as the toolbar tooltip (action.default_title). -->
    <title>__MSG_extActionTitle__</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 data-i18n="extName">PageCraft</h1>
          <p id="site-name"></p>
        </div>
        <button id="toggle-button" type="button" aria-pressed="true"></button>
      </header>

      <div id="access-banner" class="banner" hidden>
        <p data-i18n="popupAccessPrompt">PageCraft isn't enabled on this site yet.</p>
        <button id="grant-site-button" type="button" class="primary" data-i18n="popupEnableSite">Enable on this site</button>
        <button id="grant-all-button" type="button" class="secondary" data-i18n="popupEnableAll">Enable on all sites</button>
      </div>

      <label for="preset-select" data-i18n="popupPreset">Global preset</label>
      <select id="preset-select">
        <option value="none" data-i18n="popupPresetNone">No preset</option>
        <option value="dark" data-i18n="popupPresetDark">Dark mode</option>
        <option value="light" data-i18n="popupPresetLight">Light mode</option>
      </select>

      <label for="my-styles-select" data-i18n="popupStyleForSite">Style for this site</label>
      <select id="my-styles-select" disabled></select>
      <p id="rule-note" class="note" hidden></p>

      <label class="check">
        <input id="pause-toggle" type="checkbox" disabled>
        <span data-i18n="popupPauseSite">Pause PageCraft on this site</span>
      </label>

      <button id="custom-style-button" type="button" data-i18n="popupOpenEditor">CustomStyle editor</button>
      <button id="settings-button" type="button" class="secondary" data-i18n="popupOpenSettings">Settings &amp; themes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
