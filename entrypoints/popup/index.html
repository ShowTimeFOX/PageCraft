<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- WXT uses this as the toolbar tooltip (action.default_title). -->
    <title>__MSG_extActionTitle__</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <img class="logo" src="/icon/48.png" alt="" width="28" height="28">
        <div class="brand">
          <h1 data-i18n="extName">PageCraft</h1>
          <p id="site-name" class="site-name"></p>
        </div>
        <!-- Master switch; main.ts sets aria-pressed and the accessible label. -->
        <button id="toggle-button" class="switch" type="button" aria-pressed="true"><span class="switch-thumb"></span></button>
      </header>

      <div id="access-banner" class="card banner" hidden>
        <p data-i18n="popupAccessPrompt">PageCraft isn't enabled on this site yet.</p>
        <div class="button-row">
          <button id="grant-site-button" type="button" class="btn primary" data-i18n="popupEnableSite">Enable on this site</button>
          <button id="grant-all-button" type="button" class="btn ghost" data-i18n="popupEnableAll">Enable on all sites</button>
        </div>
      </div>

      <section class="card">
        <h2 class="card-title" data-i18n="popupSectionSite">This site</h2>
        <div class="field">
          <label for="my-styles-select" data-i18n="popupStyleForSite">Style for this site</label>
          <div class="select-wrap"><select id="my-styles-select" disabled></select></div>
          <p id="rule-note" class="note" hidden></p>
        </div>
        <label class="toggle-row">
          <span data-i18n="popupPauseSite">Pause PageCraft on this site</span>
          <input id="pause-toggle" class="switch-input" type="checkbox" role="switch" disabled>
        </label>
      </section>

      <section class="card">
        <h2 class="card-title" data-i18n="popupSectionGlobal">Everywhere</h2>
        <div class="field">
          <label for="preset-select" data-i18n="popupPreset">Global preset</label>
          <div class="select-wrap">
            <select id="preset-select">
              <option value="none" data-i18n="popupPresetNone">No preset</option>
              <option value="dark" data-i18n="popupPresetDark">Dark mode</option>
              <option value="light" data-i18n="popupPresetLight">Light mode</option>
            </select>
          </div>
        </div>
      </section>

      <div class="actions">
        <button id="custom-style-button" type="button" class="btn primary" data-i18n="popupOpenEditor">CustomStyle editor</button>
        <button id="settings-button" type="button" class="btn ghost" data-i18n="popupOpenSettings">Settings &amp; themes</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
