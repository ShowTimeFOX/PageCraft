<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CustomStyle - PageCraft</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header class="toolbar">
        <div class="title">
          <h1 data-i18n="editorTitle">CustomStyle</h1>
          <p id="site-name">Loading current site…</p>
        </div>
        <div class="actions">
          <label class="check" title="Show unsaved CSS on the website tab while you edit" data-i18n-title="editorLivePreviewTitle">
            <input id="preview-toggle" type="checkbox" checked> <span data-i18n="editorLivePreview">Live preview</span>
          </label>
          <button id="palette-button" type="button" class="secondary" aria-pressed="false" aria-controls="palette-panel" title="Edit the theme's colors, fonts and shape" data-i18n-title="editorPaletteTitle" data-i18n="editorPalette">Palette</button>
          <select id="history-select" title="Load a previously saved version" data-i18n-title="editorHistoryTitle" disabled>
            <option value="">History</option>
          </select>
          <button id="save-button" type="button" title="Save and apply (Ctrl+S)" data-i18n-title="editorSaveTitle"><span data-i18n="editorSave">Save</span> <kbd>Ctrl+S</kbd></button>
          <button id="new-style-button" type="button" title="Start a new style (Ctrl+N)" data-i18n-title="editorNewTitle"><span data-i18n="editorNew">New</span> <kbd>Ctrl+N</kbd></button>
          <button id="delete-button" type="button" class="secondary" title="Delete this style" data-i18n-title="editorDeleteTitle" data-i18n="editorDelete" hidden>Delete</button>
        </div>
      </header>

      <div class="style-details">
        <label for="style-name" data-i18n="editorStyleName">Style name</label>
        <input id="style-name" type="text" maxlength="60" placeholder="My custom style" data-i18n-placeholder="editorStyleNamePlaceholder">
      </div>

      <section class="prompt-panel" aria-label="AI theme generator">
        <div class="prompt-header">
          <label for="ai-prompt" data-i18n="editorPromptLabel">Describe the theme you want</label>
          <span id="provider-label" class="provider-label"></span>
          <span id="estimate" class="estimate" title="Approximate size of the next request"></span>
          <button id="ai-settings-button" type="button" class="link" data-i18n="editorSettings">Settings</button>
        </div>

        <details id="chat" class="chat" hidden>
          <summary id="chat-summary">Conversation</summary>
          <ol id="chat-log" class="chat-log"></ol>
          <button id="clear-chat-button" type="button" class="link" data-i18n="editorClearChat">Clear conversation</button>
        </details>

        <div class="prompt-row">
          <textarea id="ai-prompt" rows="2" placeholder="Example: Warm dark theme with amber accents, softer borders and a clearer heading hierarchy." data-i18n-placeholder="editorPromptPlaceholder"></textarea>
          <div class="prompt-actions">
            <div class="button-row">
              <button id="generate-button" type="button" class="primary" title="Generate CSS (Ctrl+Enter)" data-i18n-title="editorGenerateTitle">Generate</button>
              <button id="review-button" type="button" class="secondary" title="Let the AI check the previewed theme (contrast report, plus screenshot if enabled) and fix problems" data-i18n-title="editorReviewTitle" data-i18n="editorReview">Review</button>
              <button id="undo-generation-button" type="button" class="secondary" title="Restore the CSS from before the last generation or loaded version" hidden>Undo</button>
            </div>
            <label class="check" title="Send the current theme and recent conversation so the AI refines it instead of starting over">
              <input id="refine-toggle" type="checkbox" checked> <span data-i18n="editorRefine">Refine current</span>
            </label>
            <label class="check" title="Attach a screenshot of the site tab (vision-capable models only). In Chrome the site tab is shown briefly while capturing.">
              <input id="screenshot-toggle" type="checkbox"> <span data-i18n="editorScreenshot">Send screenshot</span>
            </label>
          </div>
        </div>

        <div class="status-row">
          <p id="generation-process" role="status" aria-live="polite"></p>
          <button id="contrast-button" type="button" class="chip" aria-expanded="false" aria-controls="contrast-report" title="Check text contrast on the previewed page" hidden>Contrast</button>
        </div>
        <div id="contrast-report" class="contrast-report" hidden></div>
      </section>

      <div class="workspace">
        <section class="editor-panel" aria-label="CSS editor">
          <div id="code-editor"></div>
        </section>
        <aside id="palette-panel" class="palette-panel" aria-label="Theme palette" hidden></aside>
      </div>

      <footer>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="shortcuts" data-i18n="editorShortcuts">Ctrl+Enter: generate · Ctrl+S: save · Ctrl+N: new · Ctrl+Z: undo · Ctrl+F: search · Ctrl+Space: complete</p>
      </footer>
    </main>

    <dialog id="unlock-dialog" class="unlock" aria-labelledby="unlock-title">
      <form id="unlock-form" method="dialog">
        <h2 id="unlock-title" data-i18n="editorUnlockTitle">Unlock your API keys</h2>
        <p data-i18n="editorUnlockText">Your API keys are protected with a passphrase. Enter it once for this browser session.</p>
        <input id="unlock-pass" type="password" autocomplete="current-password" required data-i18n-aria-label="optionsPassphraseShort">
        <p id="unlock-error" class="error" role="alert"></p>
        <div class="button-row">
          <button id="unlock-cancel" type="button" class="secondary" data-i18n="editorCancel">Cancel</button>
          <button type="submit" class="primary" data-i18n="optionsUnlock">Unlock</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
