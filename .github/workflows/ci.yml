name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build and zip (Chrome)
        run: npm run zip

      - name: Build and zip (Firefox)
        run: npm run zip:firefox

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pagecraft-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
