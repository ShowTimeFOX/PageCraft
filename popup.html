<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PageCraft</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>PageCraft</h1>
        <p id="site-name">Loading current site…</p>
      </header>
      <label for="css-editor">Custom CSS</label>
      <textarea id="css-editor" spellcheck="false" placeholder="body {
  font-family: system-ui, sans-serif;
}"></textarea>
      <button id="save-button" type="button">Save and apply</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
